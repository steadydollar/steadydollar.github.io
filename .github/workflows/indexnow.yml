name: IndexNow ping
on:
  push:
    branches: [main]
    paths: ['sitemap.xml', '**/index.html']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages deploy
        run: sleep 90
      - name: Send sitemap URLs to IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          KEY=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(printf '{"host":"steadydollar.github.io","key":"%s","keyLocation":"https://steadydollar.github.io/%s.txt","urlList":%s}' "$KEY" "$KEY" "$URLS")
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" https://api.indexnow.org/indexnow
